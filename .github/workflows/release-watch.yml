# Every hour, compare the latest Swift Harness release with the version the live site shows,
# and rebuild the site only when they differ. No secrets: both are public.
name: Watch Swift Harness releases

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the site when a newer release is out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/davidelarocca/swift-harness/releases/latest --jq .tag_name | sed -E 's/^.*v//')"
          shown="$(curl -fsS https://davidelarocca.com/releases.json | jq -r .swiftHarness || true)"
          echo "latest release: ${latest:-unknown}, site shows: ${shown:-unknown}"
          if [ -z "$latest" ]; then
            echo "Could not read the latest release; nothing to do."
          elif [ "$latest" != "$shown" ]; then
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Started a rebuild."
          fi
